{% macro banner(kind, text) %}
{% if text %}
{# Toast (layout/base.html) hiện thông báo này rồi nên không cần hiện lại
   trực tiếp trên trang nữa — chỉ giữ div ẩn để script chrome đọc data-toast-*. #}
<div class="hidden" data-toast-kind="{{ 'error' if kind == 'error' else 'success' }}" data-toast-text="{{ text }}"></div>
{% endif %}
{% endmacro %}
