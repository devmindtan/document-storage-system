{% extends "layout/base.html" %}

{% block title %}Đăng ký tài khoản{% endblock %}

{% block content %}
<div class="w-full max-w-md">
    <div class="flex items-center justify-center gap-3 mb-6">
        <img src="/static/images/AkzoNobel_RGB.png" alt="AkzoNobel" class="h-8 w-auto object-contain">
        <span class="w-px h-6 bg-slate-300"></span>
        <img src="/static/images/amata_engineering_logo.png" alt="Amata Engineering" class="h-8 w-auto object-contain">
    </div>

    <div class="bg-white rounded-2xl border border-slate-200 shadow-lg p-8">
        <h1 class="text-xl font-bold text-brand-900 text-center">ĐĂNG KÝ TÀI KHOẢN</h1>
        <p class="text-sm text-slate-500 text-center mt-1 mb-6">Tạo tài khoản nhân viên để sử dụng hệ thống.</p>

        {% if error %}
        <div class="bg-rose-50 border border-rose-200 text-rose-700 rounded-xl p-3 mb-4 text-sm flex items-start gap-2">
            <i class="ti ti-alert-circle text-rose-500 text-lg mt-0.5 shrink-0"></i>{{ error }}
        </div>
        {% endif %}

        <form action="/register" method="post" class="space-y-4">
            <div>
                <label for="username" class="block text-sm font-medium text-slate-700 mb-1">Username</label>
                <input id="username" type="text" name="username" placeholder="Nhập username" required
                    class="w-full border border-slate-300 rounded-lg px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-500">
            </div>
            <div>
                <label for="full_name" class="block text-sm font-medium text-slate-700 mb-1">Họ và tên</label>
                <input id="full_name" type="text" name="full_name" placeholder="Nhập họ và tên" required
                    class="w-full border border-slate-300 rounded-lg px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-500">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Mật khẩu</label>
                <input id="password" type="password" name="password" placeholder="Ít nhất 8 ký tự" required
                    class="w-full border border-slate-300 rounded-lg px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-500">
            </div>
            <div>
                <label for="confirm_password" class="block text-sm font-medium text-slate-700 mb-1">Nhập lại mật khẩu</label>
                <input id="confirm_password" type="password" name="confirm_password" placeholder="Nhập lại mật khẩu" required
                    class="w-full border border-slate-300 rounded-lg px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-500">
            </div>
            <button type="submit" class="w-full bg-brand-900 hover:bg-brand-800 text-white py-2.5 rounded-lg text-sm font-semibold transition-colors shadow-sm">Đăng ký</button>
        </form>

        <p class="text-center text-sm text-slate-500 mt-6">
            Đã có tài khoản?
            <a href="/" class="text-brand-500 font-medium hover:underline">Quay lại đăng nhập</a>
        </p>
    </div>
</div>
{% endblock %}
